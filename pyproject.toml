[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "downscaler"
version = "0.1.0"
description = "Ventana de Cumbre: downscaling GFS 27 km -> WRF 3 km para la Cordillera Blanca (Hackathon IA PUCP 2026)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app"]
